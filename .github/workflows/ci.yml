name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Runs on both operating systems you use, so "works on my machine" bugs show up here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dev dependencies
        run: uv sync
      - name: Lint (includes security rules)
        run: uv run ruff check .
      - name: Tests (shipped code only; challenges and bug hunts are excluded)
        run: uv run pytest
